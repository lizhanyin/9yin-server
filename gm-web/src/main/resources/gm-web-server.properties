# gm-web 自身 summer 配置（独立面板进程）。
# 框架要求必须起一个 server——此处为无外部用途的自身端口（默认 127.0.0.1:19083）；
# 面板 HTTP 端口（19080）由 GmWebApp 的 netty GmHttpServer 提供，
# 游戏服连接全部经 ClientMgr.register 动态注册（server.clientList 留空）。
# 注意：ConfigUtil 对 ServerConfig 字段全量必填，缺键启动失败。
server.cluster=Gm
server.serverName=gm_web
server.address=127.0.0.1
server.port=19083
server.protocol=StringLine
server.charset=UTF-8
server.password=
server.bossThread=0
server.workerThread=0
server.eventThread=0
server.msgLength=1048576
server.heartSec=60
server.coldDownMs=10
server.allowAddressEnable=false
server.allowAddressList=
server.optionSoBacklog=1024
server.minorList=
server.clientList=
