<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>九阴 GM · 服务器管理</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d23;
      --card2: #20242c;
      --line: #2a2f3a;
      --accent: #e8b34b;
      --accent2: #4ba3e8;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --ok: #3fbf6f;
      --bad: #6a7283;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font: 14px/1.6 "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(90deg, #14171d, #1c2027);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      color: var(--accent);
    }

    header .muted {
      font-size: 12px;
    }

    main {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 20px;
    }

    fieldset {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 26px;
    }

    legend {
      color: var(--accent2);
      padding: 0 6px;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-right: 14px;
      color: var(--muted);
    }

    input {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 5px 8px;
    }

    button {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 6px 14px;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #17130a;
      font-weight: 600;
    }

    button:hover {
      filter: brightness(1.15);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .srv {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .srv.offline {
      opacity: 0.62;
    }

    .srv-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bad);
      flex: none;
    }

    .dot.on {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
    }

    .srv-name {
      font-weight: 600;
      font-size: 15px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .srv-addr {
      color: var(--accent2);
      font-size: 12px;
      font-family: Consolas, monospace;
    }

    .srv-stats {
      color: var(--muted);
      font-size: 12px;
      margin: 8px 0 12px;
      min-height: 20px;
    }

    .srv-actions {
      display: flex;
      gap: 8px;
    }

    .srv-actions .primary {
      flex: 1;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    #empty {
      color: var(--muted);
      padding: 30px 0;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <h1>九阴 GM · 服务器管理</h1>
    <span class="muted">服务器列表保存在本浏览器（localStorage），选择服务器后进入控制台</span>
  </header>
  <main>
    <fieldset>
      <legend>添加游戏服（RPC 地址）</legend>
      <label>名称 <input id="add-name" placeholder="本机" style="width: 120px" /></label>
      <label>地址 <input id="add-host" placeholder="127.0.0.1" style="width: 130px" /></label>
      <label>RPC 端口 <input id="add-port" type="number" value="19081" style="width: 80px" /></label>
      <button class="primary" onclick="addServer()">添加</button>
      <p class="hint">
        游戏服需开启 GM RPC 端口（server.properties 的 minor.gm，默认 127.0.0.1:19081）。
      </p>
    </fieldset>
    <div id="empty" hidden>还没有服务器——先在上方添加一个</div>
    <div class="grid" id="servers"></div>
  </main>
  <script>
    const KEY = "gm_servers";
    const POLL_MS = 3000;

    function load() {
      try {
        let list = JSON.parse(localStorage.getItem(KEY) || "[]");
        if (Array.isArray(list)) return list;
      } catch (e) { }
      return [];
    }

    function save(list) {
      localStorage.setItem(KEY, JSON.stringify(list));
    }

    // 首次使用预填本机默认条目。
    if (!localStorage.getItem(KEY)) {
      save([{ id: Date.now(), name: "本机", host: "127.0.0.1", rpcPort: 19081 }]);
    }

    function validHost(h) {
      return /^(localhost|(\d{1,3}\.){3}\d{1,3})$/i.test((h || "").trim());
    }

    function addServer() {
      let name = document.querySelector("#add-name").value.trim();
      let host = document.querySelector("#add-host").value.trim();
      let port = +document.querySelector("#add-port").value;
      if (!validHost(host)) return alert("地址需为 IP 或 localhost");
      if (!(port > 0 && port < 65536)) return alert("端口不合法");
      let list = load();
      let addr = host + ":" + port;
      if (list.some((s) => s.host + ":" + s.rpcPort === addr)) {
        return alert("该服务器已在列表中");
      }
      list.push({ id: Date.now(), name: name || addr, host: host, rpcPort: port });
      save(list);
      document.querySelector("#add-name").value = "";
      render();
    }

    function removeServer(id) {
      if (!confirm("从列表移除该服务器？")) return;
      save(load().filter((s) => s.id !== id));
      render();
    }

    function renameServer(id) {
      let list = load();
      let s = list.find((x) => x.id === id);
      if (!s) return;
      let name = prompt("服务器名称", s.name);
      if (name === null) return;
      s.name = name.trim() || s.host + ":" + s.rpcPort;
      save(list);
      render();
    }

    const statusCache = {};

    async function pollStatus() {
      for (let s of load()) {
        let addr = s.host + ":" + s.rpcPort;
        try {
          let r = await fetch("/api/manage/status?s=" + encodeURIComponent(addr));
          statusCache[addr] = await r.json();
        } catch (e) {
          statusCache[addr] = { online: false };
        }
      }
      render();
    }

    function fmtUptime(sec) {
      if (sec == null) return "-";
      let h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
      return h > 0 ? h + "时" + m + "分" : m + "分" + (sec % 60) + "秒";
    }

    function render() {
      let list = load();
      let box = document.querySelector("#servers");
      document.querySelector("#empty").hidden = list.length > 0;
      box.innerHTML = "";
      for (let s of list) {
        let addr = s.host + ":" + s.rpcPort;
        let st = statusCache[addr] || { online: false };
        let card = document.createElement("div");
        card.className = "srv" + (st.online ? "" : " offline");
        let stats = st.online && st.status
          ? "在线 " + (st.status.connected_clients != null ? st.status.connected_clients : 0) + " 人" +
          " · 已运行 " + fmtUptime(st.status.uptime_sec) +
          (st.status.phase ? " · " + st.status.phase : "")
          : "未连接";
        card.innerHTML =
          '<div class="srv-head"><span class="dot' + (st.online ? " on" : "") + '"></span>' +
          '<span class="srv-name"></span>' +
          '<span class="srv-addr">' + addr + "</span></div>" +
          '<div class="srv-stats">' + stats + "</div>" +
          '<div class="srv-actions">' +
          '<button class="primary" onclick="enter(' + s.id + ')">进入控制台</button>' +
          '<button onclick="renameServer(' + s.id + ')">改名</button>' +
          '<button onclick="removeServer(' + s.id + ')">移除</button>' +
          "</div>";
        card.querySelector(".srv-name").textContent = s.name;
        box.appendChild(card);
      }
    }

    function enter(id) {
      let s = load().find((x) => x.id === id);
      if (!s) return;
      let addr = s.host + ":" + s.rpcPort;
      location.href =
        "console.html?s=" + encodeURIComponent(addr) + "&name=" + encodeURIComponent(s.name);
    }

    render();
    pollStatus();
    setInterval(pollStatus, POLL_MS);
  </script>
</body>

</html>
